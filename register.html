
<!DOCTYPE html>
<html>

<head>
    <title>FoodRescue - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1>Create Account</h1>

        <p>Join FoodRescue and help reduce food waste.</p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Create a password" required>

            <label>Choose your role</label>

            <select id="role" required>
                <option value="">Select role</option>
                <option value="restaurant">Restaurant</option>
                <option value="ngo">NGO</option>
                <option value="volunteer">Volunteer</option>
            </select>

            <button type="submit">Create Account</button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html">← Back to Home</a>

    </div>


    <script>

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const role = document.getElementById("role").value;

            // Store basic demo registration information
            const user = {
                name: name,
                email: email,
                role: role
            };

            localStorage.setItem("foodRescueUser", JSON.stringify(user));

            alert("Registration successful!");

            // Redirect according to the selected role
            if (role === "restaurant") {
                window.location.href = "restaurant.html";
            }

            else if (role === "ngo") {
                window.location.href = "ngo.html";
            }

            else if (role === "volunteer") {
                window.location.href = "volunteer.html";
            }

        });

    </script>

</body>

</html>
